name: .watch
run-name: '[watch] ${{ inputs.message }}'

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Space-separated list of key=run_id to watch.'
        required: true
        type: string
      message:
        description: 'Message to show in the name of the run.'
        required: false
        default: "dispatched"
        type: string

jobs:

  watch:
    runs-on: ubuntu-latest
    steps:
    - env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        for ITEM in ${{ inputs.ids }}; do
          KEY="${ITEM%=*}"
          IDX="${ITEM#*=}"
          echo "Watching $IDX ($KEY)..."
          gh run watch "$IDX" -i 10 > /dev/null 2>&1
          echo "$IDX ($KEY) completed: $(gh run view "$IDX" --json conclusion --jq '.conclusion')"
        done

# success
# failure
# cancelled
# skipped
# startup_failure
# action_required
# timed_out
