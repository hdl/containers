name: .watch
run-name: '👀 ${{ inputs.message }}'

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Space-separated list of key=run_id to watch.'
        required: true
        type: string
      message:
        description: 'Message to show in the name of the run.'
        required: false
        default: "dispatched"
        type: string

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:

  list:
    runs-on: ubuntu-latest
    steps:
    - name: 📋 List of run IDs to watch
      run: |
        for ITEM in ${{ inputs.ids }}; do
          KEY="${ITEM%=*}"
          IDX="${ITEM#*=}"
          echo "  - $KEY: [$IDX](https://github.com/${{ github.repository }}/actions/runs/$IDX)" >> "$GITHUB_STEP_SUMMARY"
        done

  watch:
    runs-on: ubuntu-latest
    steps:
    - name: 👀 Watch
      run: |
        for ITEM in ${{ inputs.ids }}; do
          KEY="${ITEM%=*}"
          IDX="${ITEM#*=}"
          echo "Watching $IDX ($KEY)..."
          gh run watch "$IDX" -i 10 > /dev/null 2>&1
          echo "$IDX ($KEY) completed: $(gh run view "$IDX" --json conclusion --jq '.conclusion')"
        done

  timeout:
    if: >-
      always() &&
      needs.watch.result == 'cancelled'
    needs: watch
    runs-on: ubuntu-latest
    steps:
    - name: ⏰ Check annotations and redispatch
      uses: $/.github/self-script
      with:
        scriptfile: timeout.py
      env:
        GH_INPUT_IDS: ${{ inputs.ids }}
        GH_INPUT_MESSAGE: ${{ inputs.message }}
