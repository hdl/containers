name: .watch
run-name: '👀 ${{ inputs.message }}'

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Space-separated list of key=run_id to watch.'
        required: true
        type: string
      rerun:
        description: 'Maximum number of attempts to run (failing) jobs.'
        required: false
        default: 3
        type: string
      message:
        description: 'Message to show in the name of the run.'
        required: false
        default: "dispatched"
        type: string

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  GH_INPUT_IDS: ${{ inputs.ids }}

jobs:

  inputs:
    runs-on: ubuntu-latest
    steps:
    - name: 📋 List of run IDs to watch
      run: |
        echo "rerun: ${{ inputs.rerun }}" >> "$GITHUB_STEP_SUMMARY"
        for ITEM in ${{ inputs.ids }}; do
          KEY="${ITEM%=*}"
          IDX="${ITEM#*=}"
          echo "  - $KEY: [$IDX](https://github.com/${{ github.repository }}/actions/runs/$IDX)" >> "$GITHUB_STEP_SUMMARY"
        done

  watch:
    runs-on: ubuntu-latest
    steps:
    - name: 👀 Watch
      run: |
        function watch() {
          local IDX="${1#*=}"
          local ATTEMPT=0
          local CONCLUSION="failure"
          while [ "$CONCLUSION" = "failure" ] && [ "$ATTEMPT" -lt "${{ inputs.rerun }}" ]; do
            if [ "$ATTEMPT" -gt 0 ]; then
              echo "Rerun $1 after attempt $ATTEMPT"
              gh run rerun "$IDX" --failed
            fi
            echo "Watching $1..."
            gh run watch "$IDX" -i 300 > /dev/null
            echo "Completed $1"
            local VIEW=$(gh run view "$IDX" --json attempt,conclusion)
            ATTEMPT=$(jq -r '.attempt' <<<$VIEW)
            CONCLUSION=$(jq -r '.conclusion' <<<$VIEW)
          done
          local MDREF="${1%=*}: [$IDX](https://github.com/${{ github.repository }}/actions/runs/$IDX)"
          echo "- $MDREF | $CONCLUSION [$ATTEMPT]" >> conclusion.md
        }
        for ITEM in ${{ inputs.ids }}; do watch "$ITEM" & done
        wait
        cat conclusion.md | tee "$GITHUB_STEP_SUMMARY"
    - name: 🐍 Install Python dependencies
      run: pip3 install tabulate
    - name: 📊 Collect and process results
      uses: $/.github/self-script
      with:
        scriptfile: results.py

  timeout:
    if: >-
      always() &&
      needs.watch.result == 'cancelled'
    needs: watch
    runs-on: ubuntu-latest
    steps:
    - name: ⏰ Check annotations and redispatch
      uses: $/.github/self-script
      with:
        scriptfile: timeout.py
      env:
        GH_INPUT_RERUN: ${{ inputs.rerun }}
        GH_INPUT_MESSAGE: ${{ inputs.message }}
