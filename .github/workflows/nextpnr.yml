name: 'nextpnr'

on:
  pull_request:
  push:
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1

jobs:

  nextpnr-build:
    uses: $/.github/workflows/.build-test-release.yml
    with:
      key: nextpnr-build
      skip-test: True
      skip-release: ${{ github.event_name == 'pull_request' }}
    secrets: inherit

  nextpnr-prjs:
    needs: nextpnr-build
    uses: $/.github/workflows/.build-test-release.yml
    with:
      key: nextpnr-prjs
      skip-release: ${{ github.event_name == 'pull_request' }}
    secrets: inherit

  nextpnr:
    needs:
      - nextpnr-build
      - nextpnr-prjs
    uses: $/.github/workflows/.build-test-release.yml
    with:
      key: nextpnr
      skip-release: ${{ github.event_name == 'pull_request' }}
    secrets: inherit
