name: .tester

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      keys:
        description: 'Space-separated list of keys to trigger flows.'
        required: true
        type: string
      skip-release:
        description: 'Skip pushing and mirroring to container registries.'
        required: false
        default: false
        type: string

jobs:

  flow-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      skip-release: ${{ steps.generate.outputs.skip-release }}
    steps:
    - id: generate
      shell: python
      run: |
        from os import environ
        match "${{ github.event_name }}":
          case "workflow_dispatch":
            flows = "${{ inputs.keys }}".split(' ')
            skip_release = "${{ inputs.skip-release }}".split(' ')
          case _:
            flows = [
              'boolector',
              'netgen',
              'nvc'
            ]
            skip_release = "${{ github.event_name == 'pull_request' }}"
        with open(environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as gho:
          gho.write(f"matrix={[{'key': flow} for flow in flows]!s}\n")
          gho.write(f"skip-release={skip_release}\n")

  flows:
    needs: flow-matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.flow-matrix.outputs.matrix) }}
    name: ${{ matrix.key }}
    uses: $/.github/workflows/.build-test-release.yml
    with:
      key: ${{ matrix.key }}
      skip-release: ${{ needs.flow-matrix.outputs.skip-release }}
    secrets: inherit

  results:
    if: '!cancelled()'
    needs: flows
    runs-on: ubuntu-latest
    name: flows-results
    steps:
    - run: echo "Results!"
