name: .scheduler

on:
  workflow_dispatch:
    inputs:
      keys:
        description: 'Space-separated list of keys to trigger flows.'
        required: true
        type: string

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
# TODO: pass meaningful message as "$4": ${{ github.event.head_commit.message }}
# TODO: print branches and commit refs as a summary in the reusable workflow
    - env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        for key in ${{ inputs.keys }}; do
          ./.github/trigger.sh \
            "${{ github.ref_name }}" \
            "$key" \
            "${{ github.event_name == 'pull_request' }}"
        done
