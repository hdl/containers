name: .scheduler

on:
  #push:
  schedule:
    - cron: '17 0 * * 5'
  workflow_dispatch:
    inputs:
      keys:
        description: 'Space-separated list of keys to trigger flows.'
        required: true
        type: string
      skip-release:
        description: 'Skip pushing and mirroring to container registries.'
        required: false
        default: false
        type: string

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - env:
        GH_TOKEN: ${{ github.token }}
        GH_INPUT_KEYS: ${{ inputs.keys }}
        GH_INPUT_SKIP-RELEASE: ${{ inputs.skip-release }}
        GH_MESSAGE: ${{ github.event.head_commit.message }}
      run: ./.github/trigger.py
