name: 'magic'

on:
  pull_request:
  push:
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1

jobs:


  magic:
    uses: $/.github/workflows/.build-test-release.yml
    with:
      key: magic
      skip-release: ${{ github.event_name == 'pull_request' }}
    secrets: inherit


  magic-irsim:
    needs: magic
    uses: $/.github/workflows/.build-test-release.yml
    with:
      key: magic-irsim
      skip-release: ${{ github.event_name == 'pull_request' }}
    secrets: inherit
