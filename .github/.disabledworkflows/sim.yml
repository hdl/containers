name: 'sim'

on:
  pull_request:
  push:
  schedule:
    - cron: '0 0 * * 5'
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1

jobs:

  sim:
    uses: $/.github/workflows/.build-test-release.yml
    with:
      key: sim
      skip-release: ${{ github.event_name == 'pull_request' }}
    secrets: inherit

  osvb:
    needs: sim
    uses: $/.github/workflows/.build-test-release.yml
    with:
      key: osvb
      skip-release: ${{ github.event_name == 'pull_request' }}
    secrets: inherit

  cosim:
    needs: osvb
    uses: $/.github/workflows/.build-test-release.yml
    with:
      key: cosim
      skip-release: ${{ github.event_name == 'pull_request' }}
    secrets: inherit

  gnuplot:
    needs: cosim
    uses: $/.github/workflows/.build-test-release.yml
    with:
      key: gnuplot
      skip-release: ${{ github.event_name == 'pull_request' }}
    secrets: inherit
