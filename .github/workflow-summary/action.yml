name: '[HDLC] Workflow summary'
description: 'Process summary artifacts of the jobs in the workflow.'

inputs:
  pattern:
    description: 'Pattern to filter the artifacts.'
    required: true

runs:
  using: 'composite'
  steps:

  - name: '📥 Download artifact(s): Summary'
    uses: actions/download-artifact@v8
    with:
      pattern: ${{ inputs.pattern }}
      merge-multiple: true

  - name: 📑 Process artifacts
    shell: bash
    run: ${{ github.action_path }}/summary.py
